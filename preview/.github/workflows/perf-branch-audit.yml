name: Perf Branch A-B Validation

on:
  push:
    branches: ['perf/no-visual-change']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare main comparison copy
        run: |
          git fetch origin main
          git worktree add /tmp/portfolio-main origin/main

      - name: Start both versions
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/optimized-http.log 2>&1 &
          (cd /tmp/portfolio-main && python3 -m http.server 8081 --bind 127.0.0.1 >/tmp/main-http.log 2>&1) &
          sleep 2
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent http://127.0.0.1:8081/ >/dev/null

      - name: Install regression test dependencies
        run: npm install --no-save puppeteer-core@24 pixelmatch@7 pngjs@7 >/dev/null 2>&1

      - name: Functional, layout and 3D pixel regression
        run: |
          CHROME_BIN="$(which google-chrome || which chromium || which chromium-browser)"
          export CHROME_BIN
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']
          });
          const rectSelectors = ['.hero-intro','#crt-head-feature','.desktop-icons','#language-toggle','.privacy-widget','.screen'];

          async function inspect(url, label, mobile=false) {
            const page = await browser.newPage();
            await page.setViewport(mobile
              ? {width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true}
              : {width:1440,height:900,deviceScaleFactor:1,isMobile:false,hasTouch:false});
            await page.goto(url, {waitUntil:'networkidle0', timeout:30000});
            await page.waitForFunction(() => window.__portfolioHeadState?.settled === true, {timeout:10000}).catch(()=>{});
            await page.waitForFunction(() => {
              const b=document.querySelector('#boot-enter'); return b && !b.disabled;
            }, {timeout:10000});

            const pre = await page.evaluate((sels) => {
              const rects={};
              for (const s of sels) {
                const el=document.querySelector(s);
                if (!el) { rects[s]=null; continue; }
                const r=el.getBoundingClientRect();
                rects[s]={x:r.x,y:r.y,width:r.width,height:r.height};
              }
              return {rects,headState:window.__portfolioHeadState,lang:document.documentElement.lang};
            }, rectSelectors);

            const testStyle = await page.addStyleTag({content:`
              .boot-loader,.crt-background-video,#crt-bg,#crt-fx,.noise,.scanlines,.screen-reflection,.edge-light,
              .hero-intro,.desktop-icons,.language-toggle,.privacy-widget{visibility:hidden!important}
              #crt-head-feature{visibility:visible!important;opacity:1!important;filter:none!important}
            `});
            const head = await page.$('#crt-head-feature');
            if (head) await head.screenshot({path:`/tmp/${label}-${mobile?'mobile':'desktop'}-head.png`});
            await testStyle.evaluate(el => el.remove());

            await page.click('#boot-enter');
            await page.waitForFunction(() => document.body.classList.contains('site-ready'), {timeout:10000});
            await sleep(1300); // let the consent auto-prompt timer settle completely

            const beforeLang = await page.evaluate(() => document.documentElement.lang);
            await page.click('#language-toggle');
            await sleep(100);
            const afterLang = await page.evaluate(() => document.documentElement.lang);
            if (beforeLang === afterLang) throw new Error(`${label}: language toggle did not change language`);

            const privacy = await page.evaluate(async () => {
              const wait = ms => new Promise(r => setTimeout(r, ms));
              const panel=document.querySelector('#privacy-panel');
              const toggle=document.querySelector('#privacy-toggle');
              const close=document.querySelector('#privacy-close');
              const initialOpen=Boolean(panel && !panel.hidden);
              if (panel?.hidden) toggle?.click();
              await wait(180);
              const opened=Boolean(panel && !panel.hidden);
              if (panel && !panel.hidden) close?.click();
              await wait(180);
              return {initialOpen,opened,closed:Boolean(panel?.hidden)};
            });
            if (!privacy.opened || !privacy.closed) throw new Error(`${label}: privacy interaction failed ${JSON.stringify(privacy)}`);

            await page.evaluate(() => document.querySelector('[data-open="about"]')?.click());
            await page.waitForSelector('.os-window', {timeout:5000});
            await sleep(250);
            const behavior = await page.evaluate(() => {
              const hiddenLike = el => {
                if (!el) return true;
                const c=getComputedStyle(el);
                return c.display==='none' || c.visibility==='hidden' || Number(c.opacity)===0 || el.hidden;
              };
              return {
                lang: document.documentElement.lang,
                windowOpen: Boolean(document.querySelector('.os-window')),
                privacyPanelHidden: Boolean(document.querySelector('#privacy-panel')?.hidden),
                languageHiddenWithWindow: hiddenLike(document.querySelector('#language-toggle')),
                privacyHiddenWithWindow: hiddenLike(document.querySelector('.privacy-widget'))
              };
            });
            await page.close();
            return {pre,privacy,behavior};
          }

          function compareRects(a,b,label) {
            for (const s of rectSelectors) {
              const x=a[s], y=b[s];
              if (!x || !y) {
                if (x !== y) throw new Error(`${label}: selector presence differs for ${s}`);
                continue;
              }
              for (const k of ['x','y','width','height']) {
                const delta=Math.abs(x[k]-y[k]);
                if (delta > 0.25) throw new Error(`${label}: ${s} ${k} differs by ${delta}px (${x[k]} vs ${y[k]})`);
              }
            }
          }

          function comparePng(aPath,bPath,label) {
            if (!fs.existsSync(aPath) || !fs.existsSync(bPath)) {
              console.log(`${label}: head screenshot unavailable; exact-fit and state checks remain active`);
              return;
            }
            const a=PNG.sync.read(fs.readFileSync(aPath));
            const b=PNG.sync.read(fs.readFileSync(bPath));
            if (a.width!==b.width || a.height!==b.height) throw new Error(`${label}: 3D screenshot dimensions differ`);
            const diff=new PNG({width:a.width,height:a.height});
            const mismatched=pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:0.02,includeAA:true});
            const ratio=mismatched/(a.width*a.height);
            console.log(`${label}: 3D pixel mismatch ${(ratio*100).toFixed(5)}% (${mismatched} px)`);
            if (ratio > 0.0005) throw new Error(`${label}: 3D visual mismatch exceeds 0.05%`);
          }

          for (const mobile of [false,true]) {
            const suffix=mobile?'mobile':'desktop';
            const main=await inspect('http://127.0.0.1:8081/','main',mobile);
            const opt=await inspect('http://127.0.0.1:8080/','opt',mobile);
            compareRects(main.pre.rects,opt.pre.rects,suffix);
            if (main.pre.headState?.ready !== opt.pre.headState?.ready) throw new Error(`${suffix}: 3D ready state differs`);
            if (main.privacy.opened !== opt.privacy.opened || main.privacy.closed !== opt.privacy.closed) throw new Error(`${suffix}: privacy behavior differs`);
            if (JSON.stringify(main.behavior) !== JSON.stringify(opt.behavior)) throw new Error(`${suffix}: window behavior differs\nmain=${JSON.stringify(main.behavior)}\nopt=${JSON.stringify(opt.behavior)}`);
            comparePng(`/tmp/main-${suffix}-head.png`,`/tmp/opt-${suffix}-head.png`,suffix);
            console.log(`${suffix}: layout, 3D state and interaction behavior match`);
          }
          await browser.close();
          NODE

      - name: Warm Lighthouse package
        run: npx --yes lighthouse@latest --version

      - name: Mobile Lighthouse A-B runs
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@latest http://127.0.0.1:8081/ --output=json --output-path="./main-mobile-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
            npx --yes lighthouse@latest http://127.0.0.1:8080/ --output=json --output-path="./opt-mobile-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done

      - name: Desktop Lighthouse A-B runs
        run: |
          npx --yes lighthouse@latest http://127.0.0.1:8081/ --preset=desktop --output=json --output-path=./main-desktop.json --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          npx --yes lighthouse@latest http://127.0.0.1:8080/ --preset=desktop --output=json --output-path=./opt-desktop.json --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'

      - name: A-B summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ids={score:null,FCP:'first-contentful-paint',LCP:'largest-contentful-paint',TBT:'total-blocking-time',CLS:'cumulative-layout-shift',TTI:'interactive',main:'mainthread-work-breakdown',boot:'bootup-time'};
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const val=(r,k)=>k==='score'?r.categories.performance.score*100:r.audits[ids[k]].numericValue;
          const median=a=>{a=[...a].sort((x,y)=>x-y);return a[Math.floor(a.length/2)]};
          const mobile=(prefix)=>[1,2,3].map(i=>read(`${prefix}-mobile-${i}.json`));
          const summarize=(arr)=>Object.fromEntries(Object.keys(ids).map(k=>[k,median(arr.map(r=>val(r,k)))]));
          const mainM=summarize(mobile('main')), optM=summarize(mobile('opt'));
          console.log('MOBILE_MAIN_MEDIAN',JSON.stringify(mainM));
          console.log('MOBILE_OPT_MEDIAN ',JSON.stringify(optM));
          console.log('MOBILE_DELTA      ',JSON.stringify(Object.fromEntries(Object.keys(ids).map(k=>[k,optM[k]-mainM[k]]))));
          const mainD=summarize([read('main-desktop.json')]), optD=summarize([read('opt-desktop.json')]);
          console.log('DESKTOP_MAIN',JSON.stringify(mainD));
          console.log('DESKTOP_OPT ',JSON.stringify(optD));
          console.log('DESKTOP_DELTA',JSON.stringify(Object.fromEntries(Object.keys(ids).map(k=>[k,optD[k]-mainD[k]]))));
          NODE

name: Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      audit_url:
        description: URL to audit
        required: true
        default: https://joemaserati-lab.github.io/portfolio-final/
        type: string
  workflow_run:
    workflows: ["Deploy Astro to Pages"]
    types: [completed]
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AUDIT_URL: ${{ inputs.audit_url || 'https://joemaserati-lab.github.io/portfolio-final/' }}

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live site
        run: |
          curl --fail --silent --show-error --location "$AUDIT_URL" > /dev/null

      - name: Lighthouse mobile
        run: |
          npx --yes lighthouse@latest "$AUDIT_URL" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'

      - name: Lighthouse desktop
        run: |
          npx --yes lighthouse@latest "$AUDIT_URL" \
            --preset=desktop \
            --output=json \
            --output=html \
            --output-path=./lighthouse-desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'

      - name: Print audit summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            ['MOBILE', 'lighthouse-mobile.report.json'],
            ['DESKTOP', 'lighthouse-desktop.report.json']
          ];
          const metrics = [
            ['first-contentful-paint','FCP'],
            ['largest-contentful-paint','LCP'],
            ['speed-index','Speed Index'],
            ['total-blocking-time','TBT'],
            ['cumulative-layout-shift','CLS'],
            ['interactive','TTI'],
            ['total-byte-weight','Total byte weight'],
            ['mainthread-work-breakdown','Main-thread work'],
            ['bootup-time','JS bootup'],
            ['unused-javascript','Unused JS'],
            ['unused-css-rules','Unused CSS']
          ];
          for (const [label, file] of files) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`\n===== ${label} =====`);
            for (const [, cat] of Object.entries(r.categories || {})) {
              console.log(`${cat.title}: ${Math.round((cat.score || 0) * 100)}`);
            }
            for (const [id, label2] of metrics) {
              const a = r.audits?.[id];
              if (a) console.log(`${label2}: ${a.displayValue ?? a.numericValue ?? 'n/a'} | score=${a.score}`);
            }
            const failed = Object.values(r.audits || {})
              .filter(a => a.score !== null && a.score < 0.9 && a.scoreDisplayMode !== 'notApplicable')
              .sort((a,b) => (a.score ?? 1) - (b.score ?? 1))
              .slice(0,25);
            console.log('LOW-SCORING AUDITS:');
            for (const a of failed) console.log(`- ${a.id}: ${a.title} | ${a.displayValue || ''} | score=${a.score}`);
          }
          NODE

      - name: Measure enter transition
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@latest
          cat > measure-enter.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 3
          });
          const page = await context.newPage();
          await page.addInitScript(() => {
            window.__portfolioLongTasks = [];
            window.__portfolioLayoutShifts = [];

            const describeNode = node => {
              if (!node || node.nodeType !== 1) return null;
              const parts = [node.tagName.toLowerCase()];
              if (node.id) parts.push('#' + node.id);
              if (node.classList?.length) parts.push('.' + [...node.classList].slice(0,3).join('.'));
              return {
                selector: parts.join(''),
                text: (node.textContent || '').replace(/\s+/g, ' ').trim().slice(0,80)
              };
            };

            new PerformanceObserver(list => {
              for (const e of list.getEntries()) {
                window.__portfolioLongTasks.push({ startTime: e.startTime, duration: e.duration });
              }
            }).observe({ entryTypes: ['longtask'] });

            new PerformanceObserver(list => {
              for (const e of list.getEntries()) {
                if (e.hadRecentInput) continue;
                window.__portfolioLayoutShifts.push({
                  startTime: e.startTime,
                  value: e.value,
                  sources: (e.sources || []).map(source => ({
                    node: describeNode(source.node),
                    previousRect: source.previousRect,
                    currentRect: source.currentRect
                  }))
                });
              }
            }).observe({ type: 'layout-shift', buffered: true });
          });
          await page.goto(process.env.AUDIT_URL, { waitUntil: 'networkidle' });
          await page.waitForFunction(() => {
            const b = document.querySelector('#boot-enter');
            return b && !b.disabled;
          }, { timeout: 20000 });

          const initialShifts = await page.evaluate(() => window.__portfolioLayoutShifts || []);
          const initialCls = initialShifts.reduce((sum, item) => sum + item.value, 0);
          console.log(`INITIAL OBSERVED CLS: ${initialCls.toFixed(4)} across ${initialShifts.length} shifts`);
          for (const shift of initialShifts.slice().sort((a,b) => b.value - a.value).slice(0,12)) {
            console.log(`CLS SHIFT +${shift.startTime.toFixed(1)} ms / ${shift.value.toFixed(5)}`);
            for (const source of shift.sources.slice(0,5)) {
              console.log(`  SOURCE ${source.node?.selector || 'unknown'} :: ${source.node?.text || ''}`);
              console.log(`    PREV ${JSON.stringify(source.previousRect)}`);
              console.log(`    CURR ${JSON.stringify(source.currentRect)}`);
            }
          }

          await page.evaluate(() => {
            window.__portfolioLongTasks = [];
            window.__portfolioClickMark = performance.now();
          });
          const start = Date.now();
          await page.click('#boot-enter');
          await page.waitForFunction(() => document.body.classList.contains('site-entering'), { timeout: 5000 });
          const entering = Date.now() - start;
          await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 5000 });
          const ready = Date.now() - start;
          await page.waitForTimeout(150);
          const longTasks = await page.evaluate(() => {
            const clickMark = window.__portfolioClickMark || 0;
            return (window.__portfolioLongTasks || []).filter(item => item.startTime >= clickMark);
          });
          const maxLongTask = longTasks.length ? Math.max(...longTasks.map(item => item.duration)) : 0;
          console.log(`ENTER -> site-entering: ${entering} ms`);
          console.log(`ENTER -> site-ready: ${ready} ms`);
          console.log(`Post-load long tasks: ${longTasks.length}; max ${maxLongTask.toFixed(1)} ms`);
          for (const task of longTasks.slice().sort((a,b) => b.duration - a.duration).slice(0,5)) {
            const relativeStart = task.startTime - await page.evaluate(() => window.__portfolioClickMark || 0);
            console.log(`LONG TASK +${relativeStart.toFixed(1)} ms / ${task.duration.toFixed(1)} ms`);
          }
          if (entering > 1300) throw new Error(`Enter transition too slow: ${entering} ms`);
          if (maxLongTask > 250) throw new Error(`Long task too large: ${maxLongTask.toFixed(1)} ms`);
          await browser.close();
          NODE
          npx playwright install chromium
          node measure-enter.mjs


      - name: Responsive geometry audit
        continue-on-error: true
        run: |
          cat > responsive-audit.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            ['phone-320', 320, 568, true],
            ['phone-390', 390, 844, true],
            ['phone-430', 430, 932, true],
            ['landscape-667', 667, 375, true],
            ['landscape-844', 844, 390, true],
            ['tablet-768', 768, 1024, true],
            ['tablet-1024', 1024, 768, true],
            ['desktop-1366', 1366, 768, false],
            ['desktop-1920', 1920, 1080, false],
            ['desktop-2560', 2560, 1440, false]
          ];

          const failures = [];

          for (const [name, width, height, touch] of viewports) {
            const context = await browser.newContext({
              viewport: { width, height },
              isMobile: touch,
              hasTouch: touch,
              deviceScaleFactor: touch ? 3 : 1
            });

            await context.addInitScript(() => {
              try { sessionStorage.setItem('portfolioBootSeen', '1'); } catch {}
            });

            const page = await context.newPage();
            await page.goto(process.env.AUDIT_URL, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 20000 });

            const home = await page.evaluate(() => {
              const r = el => {
                const x = el.getBoundingClientRect();
                return { left:x.left, top:x.top, right:x.right, bottom:x.bottom, width:x.width, height:x.height };
              };
              const visible = el => {
                if (!el) return false;
                const s = getComputedStyle(el);
                return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity) > 0.01;
              };
              const screen = document.querySelector('#screen');
              const sr = r(screen);
              const issues = [];
              const inside = (name, el, tol=1) => {
                if (!visible(el)) return;
                const er = r(el);
                if (er.left < sr.left-tol || er.right > sr.right+tol || er.top < sr.top-tol || er.bottom > sr.bottom+tol) {
                  issues.push(name + ' outside CRT: ' + JSON.stringify(er) + ' screen=' + JSON.stringify(sr));
                }
              };

              const lang = document.querySelector('.language-toggle');
              const privacy = document.querySelector('.privacy-widget');
              const icons = document.querySelector('.desktop-icons');
              const hero = document.querySelector('.hero-intro');

              inside('language', lang);
              inside('privacy', privacy);
              inside('icons', icons);
              inside('hero', hero);

              if (visible(lang) && visible(privacy)) {
                const a=r(lang), b=r(privacy);
                const overlap = Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)) *
                                Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if (overlap > 1) issues.push('language/privacy overlap: ' + overlap.toFixed(1) + 'px2');
              }

              if (visible(hero) && visible(icons)) {
                const a=r(hero), b=r(icons);
                const overlap = Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left)) *
                                Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if (overlap > 4) issues.push('hero/icons overlap: ' + overlap.toFixed(1) + 'px2');
              }

              return issues;
            });

            for (const issue of home) failures.push(name + ' HOME: ' + issue);

            const rootUrl = process.env.AUDIT_URL.endsWith('/') ? process.env.AUDIT_URL : process.env.AUDIT_URL + '/';
            await page.goto(new URL('work/', rootUrl).href, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 20000 });
            await page.waitForFunction(() => {
              const el=document.querySelector('#projects-view');
              return el && !el.hidden;
            }, { timeout: 5000 });
            await page.waitForTimeout(150);

            const projects = await page.evaluate(() => {
              const view=document.querySelector('#projects-view');
              const screen=document.querySelector('#screen');
              const issues=[];
              const vr=view.getBoundingClientRect(), sr=screen.getBoundingClientRect();
              if (Math.abs(vr.left-sr.left)>1 || Math.abs(vr.right-sr.right)>1 ||
                  Math.abs(vr.top-sr.top)>1 || Math.abs(vr.bottom-sr.bottom)>1) {
                issues.push('projects surface != CRT');
              }
              if (view.scrollWidth > view.clientWidth + 1) {
                issues.push('projects horizontal overflow: ' + view.scrollWidth + ' > ' + view.clientWidth);
              }
              view.scrollTop=view.scrollHeight;
              const last=document.querySelector('.project-tile-v2:last-of-type');
              if (last) {
                const lr=last.getBoundingClientRect();
                if (lr.left < sr.left-1 || lr.right > sr.right+1) {
                  issues.push('last project escapes horizontally');
                }
                if (lr.bottom > sr.bottom-8) {
                  issues.push('last project lacks bottom clearance: bottom=' + lr.bottom.toFixed(1) + ' CRT=' + sr.bottom.toFixed(1));
                }
              }
              return issues;
            });

            for (const issue of projects) failures.push(name + ' PROJECTS: ' + issue);

            const windows = [];

            for (const kind of ['about','resume','contact']) {
              await page.goto(new URL(kind + '/', rootUrl).href, { waitUntil: 'networkidle' });
              await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 20000 });
              await page.waitForFunction(k => Boolean(document.querySelector('.os-window[data-kind="' + k + '"]')), kind, { timeout:5000 });

              const issues = await page.evaluate(({ width, kind }) => {
                const screen=document.querySelector('#screen');
                const win=document.querySelector('.os-window[data-kind="' + kind + '"]');
                const body=win?.querySelector('.window-body');
                const out=[];
                if (!screen || !win) return [kind + ' route did not render expected window'];

                const sr=screen.getBoundingClientRect();
                const wr=win.getBoundingClientRect();

                if (wr.left < sr.left-1 || wr.right > sr.right+1 || wr.top < sr.top-1 || wr.bottom > sr.bottom+1) {
                  out.push(kind + ' window outside CRT');
                }

                if (width <= 1024 && (
                    Math.abs(wr.left-sr.left)>1 || Math.abs(wr.right-sr.right)>1 ||
                    Math.abs(wr.top-sr.top)>1 || Math.abs(wr.bottom-sr.bottom)>1)) {
                  out.push(kind + ' not fullscreen at <=1024');
                }

                if (body && body.scrollWidth > body.clientWidth + 1) {
                  out.push(kind + ' horizontal overflow: ' + body.scrollWidth + ' > ' + body.clientWidth);
                }

                return out;
              }, { width, kind });

              windows.push(...issues);
            }

            for (const issue of windows) failures.push(name + ' WINDOWS: ' + issue);

            const count = home.length + projects.length + windows.length;
            console.log(name + ' ' + width + 'x' + height + ': ' + (count ? 'ISSUES' : 'PASS'));
            await context.close();
          }

          if (failures.length) {
            console.log('\nRESPONSIVE GEOMETRY FAILURES:');
            for (const item of failures) console.log('- ' + item);
            throw new Error(failures.length + ' responsive geometry issue(s) detected');
          }

          console.log('\nResponsive geometry audit: PASS');
          await browser.close();
          NODE
          node responsive-audit.mjs


      - name: Head and loader lifecycle regression
        continue-on-error: false
        run: |
          cat > head-lifecycle-audit.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl']
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1
          });
          const page = await context.newPage();

          await page.goto(process.env.AUDIT_URL, { waitUntil: 'networkidle' });
          await page.waitForFunction(() => {
            const button = document.querySelector('#boot-enter');
            return button && !button.disabled;
          }, { timeout: 25000 });

          const preEntry = await page.evaluate(() => {
            const anchor = document.querySelector('.boot-title-anchor');
            const scramble = document.querySelector('.boot-title-scramble');
            return {
              head: window.__portfolioHeadState || null,
              anchorVisibility: anchor ? getComputedStyle(anchor).visibility : null,
              scrambleVisibility: scramble ? getComputedStyle(scramble).visibility : null,
              titleText: document.querySelector('#boot-gate h2')?.innerText || ''
            };
          });

          if (!preEntry.head?.settled || !preEntry.head?.ready) {
            throw new Error('3D head was not ready before the loader enabled entry');
          }
          if (preEntry.anchorVisibility !== 'hidden' || preEntry.scrambleVisibility === 'hidden') {
            throw new Error('Loader title layers are not visually de-duplicated');
          }

          await page.click('#boot-enter');
          await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 8000 });
          await page.waitForFunction(() => {
            const feature = document.querySelector('#crt-head-feature');
            return feature?.classList.contains('is-ready') && !feature.classList.contains('is-failed');
          }, { timeout: 5000 });

          await page.click('.primary-action');
          await page.waitForFunction(() => {
            const view = document.querySelector('#projects-view');
            return view && !view.hidden;
          }, { timeout: 5000 });

          const openState = await page.evaluate(() => {
            const feature = document.querySelector('#crt-head-feature');
            return {
              windowOpen: feature?.classList.contains('is-window-open'),
              ready: feature?.classList.contains('is-ready')
            };
          });
          if (!openState.windowOpen || !openState.ready) {
            throw new Error('Head did not enter the expected project-overlay state');
          }

          await page.click('.projects-close');
          await page.waitForFunction(() => {
            const view = document.querySelector('#projects-view');
            return view && view.hidden;
          }, { timeout: 5000 });
          await page.waitForFunction(() => {
            const feature = document.querySelector('#crt-head-feature');
            if (!feature) return false;
            const style = getComputedStyle(feature);
            const canvas = document.querySelector('#crt-head-canvas');
            const rect = canvas?.getBoundingClientRect();
            return feature.classList.contains('is-ready')
              && !feature.classList.contains('is-window-open')
              && !feature.classList.contains('is-failed')
              && style.visibility === 'visible'
              && Number.parseFloat(style.opacity) > 0.4
              && rect && rect.width > 10 && rect.height > 10;
          }, { timeout: 5000 });

          console.log('Head/loader lifecycle audit: PASS');
          await browser.close();
          NODE
          node head-lifecycle-audit.mjs


      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lighthouse-mobile.report.json
            lighthouse-mobile.report.html
            lighthouse-desktop.report.json
            lighthouse-desktop.report.html
          retention-days: 14

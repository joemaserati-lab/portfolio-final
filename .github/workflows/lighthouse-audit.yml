name: Lighthouse Audit
on:
  workflow_run:
    workflows: ["Deploy Astro to Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-audit
  cancel-in-progress: true
jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit mobile and desktop
        run: |
          npm install --no-save --no-audit --no-fund lighthouse@12
          npx lighthouse https://joemaserati-lab.github.io/portfolio-final/ --chrome-flags="--headless --no-sandbox" --output=json --output=html --output-path=lighthouse-mobile
          npx lighthouse https://joemaserati-lab.github.io/portfolio-final/ --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output=html --output-path=lighthouse-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-*.report.*
          retention-days: 14

name: Astro Build Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.deploy/**'
      - 'package.json'
      - 'astro.config.mjs'
      - '.github/workflows/astro-build.yml'
      - '.github/workflows/astro-pages.yml'
      - '.github/workflows/lighthouse-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Wolof PWA
        run: |
          cat .deploy/wolof-app.part00 .deploy/wolof-app.part01 .deploy/wolof-app.part02 .deploy/wolof-app.part03 .deploy/wolof-app.part04 .deploy/wolof-app.part05 | base64 -d > /tmp/wolof-app-deploy.zip
          unzip -tq /tmp/wolof-app-deploy.zip
          rm -rf public/wolof
          mkdir -p public/wolof
          unzip -q /tmp/wolof-app-deploy.zip -d public/wolof
          test -f public/wolof/index.html
          test -f public/wolof/service-worker.js
          test -f public/wolof/manifest.webmanifest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Astro
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/resume/index.html
          test -f dist/contact/index.html
          test -f dist/work/index.html
          test -f dist/work/tovadu/index.html
          test -f dist/work/pholia/index.html
          test -f dist/work/sapy/index.html
          test -f dist/work/platinum-technologies/index.html
          test -f dist/work/colorcopy-large-format/index.html
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/js/portfolio.js
          test -f dist/css/crt-outline.css
          test -f dist/assets/models/human_head_reference3.glb
          test -f dist/wolof/index.html
          test -f dist/wolof/service-worker.js
          test -f dist/wolof/manifest.webmanifest

      - name: Upload Astro dist
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist/
          retention-days: 7

name: Temporary mobile head poster comparison
on:
  push:
    branches: [fix/mobile-head-poster-alignment-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/portfolio-head-preview.log 2>&1 &)
          for i in $(seq 1 35); do
            curl --fail --silent http://127.0.0.1:4321/portfolio-final/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-head-preview.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture original poster vs first WebGL model frame
        env:
          AUDIT_URL: http://127.0.0.1:4321/portfolio-final/
          HEAD_CAPTURE_DIR: /tmp/mobile-head-captures
        run: node scripts/capture-mobile-head.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-head-before
          path: /tmp/mobile-head-captures
          retention-days: 7

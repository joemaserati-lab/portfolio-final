name: Temporary mobile head poster comparison
on:
  push:
    branches: [fix/mobile-head-poster-alignment-2026-11-04]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Start preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/portfolio-head-preview.log 2>&1 &)
          for i in $(seq 1 35); do
            curl --fail --silent http://127.0.0.1:4321/portfolio-final/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-head-preview.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture original poster vs first WebGL model frame
        env:
          AUDIT_URL: http://127.0.0.1:4321/portfolio-final/
          HEAD_CAPTURE_DIR: /tmp/mobile-head-captures
        run: node scripts/capture-mobile-head.mjs
      - name: Refresh clean WebP assets from isolated model canvas
        env:
          HEAD_CAPTURE_DIR: /tmp/mobile-head-captures
        run: |
          python -m pip install --quiet Pillow numpy
          python scripts/generate-mobile-head-posters.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/images/mobile-head-poster-mobile-360.webp public/assets/images/mobile-head-poster-mobile-540.webp public/assets/images/mobile-head-poster-mobile-320.webp public/assets/images/mobile-head-poster-mobile-landscape.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: remove UI artifacts from WebGL poster captures"
            git push origin HEAD:fix/mobile-head-poster-alignment-2026-11-04
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-head-before
          path: /tmp/mobile-head-captures
          retention-days: 7

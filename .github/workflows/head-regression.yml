name: Head Lifecycle Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/head-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: head-regression-main
  cancel-in-progress: true

env:
  AUDIT_URL: http://127.0.0.1:4321/portfolio-final/

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build local production candidate
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          npm run check

      - name: Serve built candidate
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/portfolio-preview.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error "$AUDIT_URL" > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium

      - name: Test loader and head lifecycle
        run: |
          cat > head-regression.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl']
          });

          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1
          });

          const page = await context.newPage();
          await page.goto(process.env.AUDIT_URL, { waitUntil: 'networkidle' });

          await page.waitForFunction(() => {
            const button = document.querySelector('#boot-enter');
            return button && !button.disabled;
          }, null, { timeout: 20000 });

          const loaderState = await page.evaluate(() => {
            const title = document.querySelector('#boot-gate h2');
            return {
              text: title?.innerText || '',
              childCount: title?.children.length ?? -1,
              head: window.__portfolioHeadState || null
            };
          });

          if (!loaderState.text.trim() || loaderState.childCount !== 0) {
            throw new Error('Loader title is duplicated or structurally layered');
          }
          if (loaderState.head?.settled && loaderState.head?.ready === false) {
            throw new Error('3D head failed before entry');
          }

          await page.click('#boot-enter');

          await page.waitForFunction(() => document.body.classList.contains('site-ready'), { timeout: 15000 });
          await page.waitForFunction(() => {
            const feature = document.querySelector('#crt-head-feature');
            const state = window.__portfolioHeadState;
            return state?.settled
              && state?.ready
              && feature?.classList.contains('is-ready')
              && !feature.classList.contains('is-failed');
          }, null, { timeout: 5000 });

          await page.click('.primary-action');
          await page.waitForFunction(() => {
            const view = document.querySelector('#projects-view');
            return view && !view.hidden;
          }, null, { timeout: 5000 });

          const openState = await page.evaluate(() => {
            const feature = document.querySelector('#crt-head-feature');
            return {
              ready: feature?.classList.contains('is-ready'),
              windowOpen: feature?.classList.contains('is-window-open')
            };
          });

          if (!openState.ready || !openState.windowOpen) {
            throw new Error('Head did not enter the expected projects-open state');
          }

          await page.evaluate(() => {
            const close = document.querySelector('.projects-close');
            if (!close) throw new Error('Projects close control missing');
            close.click();
          });

          await page.waitForFunction(() => {
            const view = document.querySelector('#projects-view');
            return view && view.hidden;
          }, null, { timeout: 5000 });

          await page.waitForFunction(() => {
            const feature = document.querySelector('#crt-head-feature');
            const canvas = document.querySelector('#crt-head-canvas');
            if (!feature || !canvas) return false;
            const style = getComputedStyle(feature);
            const rect = canvas.getBoundingClientRect();
            return feature.classList.contains('is-ready')
              && !feature.classList.contains('is-window-open')
              && !feature.classList.contains('is-failed')
              && style.visibility === 'visible'
              && Number.parseFloat(style.opacity) > 0.4
              && rect.width > 10
              && rect.height > 10;
          }, null, { timeout: 5000 });

          console.log('HEAD LIFECYCLE REGRESSION: PASS');
          await browser.close();
          NODE

          node head-regression.mjs

      - name: Test mobile loader and single-tap project navigation
        run: node tests/mobile-regression.mjs

name: Live Preview Lighthouse Compare

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LIVE_URL: https://joemaserati-lab.github.io/portfolio-final/
  PREVIEW_URL: https://joemaserati-lab.github.io/portfolio-final/preview/

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify URLs
        run: |
          curl --fail --silent --show-error --location "$LIVE_URL" > /dev/null
          curl --fail --silent --show-error --location "$PREVIEW_URL" > /dev/null
      - name: Warm Lighthouse
        run: npx --yes lighthouse@latest --version
      - name: Mobile repeated runs
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@latest "$LIVE_URL" --output=json --output-path="live-mobile-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
            npx --yes lighthouse@latest "$PREVIEW_URL" --output=json --output-path="preview-mobile-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
      - name: Desktop repeated runs
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@latest "$LIVE_URL" --preset=desktop --output=json --output-path="live-desktop-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
            npx --yes lighthouse@latest "$PREVIEW_URL" --preset=desktop --output=json --output-path="preview-desktop-$i.json" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
      - name: Summarize medians
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ids={score:null,FCP:'first-contentful-paint',LCP:'largest-contentful-paint',SI:'speed-index',TBT:'total-blocking-time',CLS:'cumulative-layout-shift',TTI:'interactive',main:'mainthread-work-breakdown',boot:'bootup-time',bytes:'total-byte-weight'};
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const val=(r,k)=>k==='score'?r.categories.performance.score*100:r.audits[ids[k]]?.numericValue;
          const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
          const summary=(prefix,device)=>Object.fromEntries(Object.keys(ids).map(k=>[k,median([1,2,3].map(i=>val(read(`${prefix}-${device}-${i}.json`),k)).filter(Number.isFinite))]));
          const pct=(before,after)=>((after-before)/before)*100;
          for (const device of ['mobile','desktop']) {
            const a=summary('live',device), b=summary('preview',device);
            console.log(`===== ${device.toUpperCase()} =====`);
            console.log('LIVE='+JSON.stringify(a));
            console.log('PREVIEW='+JSON.stringify(b));
            console.log('DELTA='+JSON.stringify(Object.fromEntries(Object.keys(ids).map(k=>[k,(b[k]??0)-(a[k]??0)]))));
            console.log('PCT='+JSON.stringify(Object.fromEntries(Object.keys(ids).filter(k=>Number.isFinite(a[k])&&a[k]!==0&&Number.isFinite(b[k])).map(k=>[k,pct(a[k],b[k])]))));
          }
          NODE
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-lighthouse
          path: |
            live-*.json
            preview-*.json
          retention-days: 7
